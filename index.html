<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Santo Terço e Evangelho do Dia</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0b0c10;
      font-family: 'Montserrat', sans-serif;
      color: #ffffff;
    }

    .app-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
    }

    .bg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 0.3s ease-in-out;
      z-index: 1;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.92) 100%);
      backdrop-filter: blur(3px);
      z-index: 2;
    }

    /* 1. Topo: Contas do Terço */
    .header-zone {
      position: relative;
      z-index: 20;
      width: 100%;
      height: 52px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px 12px 0 12px;
      flex-shrink: 0;
    }

    .rosary-tracker {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.85);
      padding: 6px 14px;
      border-radius: 30px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .bead {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      transition: all 0.3s ease;
    }

    .bead.pn {
      width: 15px;
      height: 15px;
      border: 1.5px solid #d4af37;
    }

    .bead.completed {
      background: #8b7324;
      border-color: #d4af37;
    }

    .bead.current {
      background: #f1c40f;
      border-color: #ffffff;
      box-shadow: 0 0 10px #f1c40f, 0 0 18px #d4af37;
      transform: scale(1.3);
    }

    .bead-separator {
      width: 8px;
      height: 1px;
      background: rgba(212, 175, 55, 0.4);
    }

    /* 2. Centro: Cartão de Leitura */
    .main-content-zone {
      position: relative;
      z-index: 20;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px 14px;
    }

    .content-card {
      width: 100%;
      max-width: 860px;
      height: 100%;
      overflow-y: auto;
      padding: 20px 16px;
      text-align: center;
      background: rgba(15, 17, 26, 0.90);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.85);
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #d4af37 transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .content-card::-webkit-scrollbar {
      width: 5px;
    }
    .content-card::-webkit-scrollbar-thumb {
      background: #d4af37;
      border-radius: 3px;
    }

    .badge {
      display: inline-block;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #d4af37;
      margin-bottom: 8px;
      border: 1px solid #d4af37;
      padding: 3px 12px;
      border-radius: 20px;
      flex-shrink: 0;
    }

    h1 {
      font-family: 'Cinzel', serif;
      color: #f1c40f;
      font-size: 1.35rem;
      margin-bottom: 8px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
      flex-shrink: 0;
    }

    h2 {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      color: #d4af37;
      margin-bottom: 12px;
      line-height: 1.4;
      flex-shrink: 0;
    }

    .acclamacao-box {
      font-style: italic;
      color: #ffd768;
      font-size: 0.95rem;
      border-left: 2px solid #d4af37;
      padding-left: 10px;
      margin: 8px 0 12px 0;
      text-align: left;
      width: 100%;
      flex-shrink: 0;
    }

    .prayer-text {
      font-size: 1.15rem;
      line-height: 1.75;
      color: #ececec;
      white-space: pre-line;
      text-align: center;
      user-select: text;
      width: 100%;
    }

    .prayer-text.align-justify {
      text-align: justify;
      text-justify: inter-word;
    }

    .liturgical-resp {
      color: #f1c40f;
      font-weight: 600;
    }

    /* Frases da leitura guiada */
    .phrase-line {
      display: block;
      margin-bottom: 6px;
      opacity: 0.28;
      transition: opacity 0.35s ease, color 0.35s ease, transform 0.35s ease;
      transform: scale(0.98);
    }

    .phrase-line.active {
      opacity: 1;
      color: #ffd768;
      text-shadow: 0 0 10px rgba(241, 196, 15, 0.4);
      transform: scale(1.02);
      font-weight: 600;
    }

    .phrase-line.read {
      opacity: 0.85;
      color: #ffffff;
      transform: scale(1);
    }

    .phrase-spacer {
      height: 12px;
    }

    /* 3. Rodapé */
    .footer-zone {
      position: relative;
      z-index: 100;
      width: 100%;
      height: 65px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4px 10px calc(6px + env(safe-area-inset-bottom, 0px)) 10px;
      flex-shrink: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(10, 12, 16, 0.95);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid rgba(212, 175, 55, 0.5);
      box-shadow: 0 4px 20px rgba(0,0,0,0.9);
    }

    .btn {
      background: transparent;
      border: 1px solid #d4af37;
      color: #d4af37;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .btn:active:not(:disabled), .btn:hover:not(:disabled) {
      background: rgba(212, 175, 55, 0.25);
    }

    .btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      border-color: #666666;
      color: #888888;
    }

    .counter {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: #f1c40f;
      min-width: 60px;
      text-align: center;
    }

    @media (min-width: 768px) {
      .header-zone { height: 65px; }
      .footer-zone { height: 75px; }
      .content-card { padding: 30px; }
      h1 { font-size: 1.85rem; }
      h2 { font-size: 1.15rem; }
      .prayer-text { font-size: 1.25rem; line-height: 1.85; }
      .bead { width: 14px; height: 14px; }
      .bead.pn { width: 18px; height: 18px; }
      .rosary-tracker { gap: 8px; padding: 8px 18px; }
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div class="bg-layer" id="bgLayer"></div>
    <div class="overlay"></div>

    <header class="header-zone">
      <div class="rosary-tracker" id="rosaryTracker" style="display: none;"></div>
    </header>

    <main class="main-content-zone" id="touchZone">
      <div class="content-card" id="cardContainer">
        <div class="badge" id="cardBadge">Oração Inicial</div>
        <h1 id="cardTitle">O Santo Terço</h1>
        <h2 id="cardSubtitle" style="display: none;"></h2>
        <div class="acclamacao-box" id="cardAcclamacao" style="display: none;"></div>
        <div class="prayer-text" id="cardBody">Carregando os mistérios...</div>
      </div>
    </main>

    <footer class="footer-zone">
      <div class="controls" id="controls">
        <button class="btn" id="btnPrev" onclick="prevSlide()" aria-label="Slide Anterior">◀</button>
        <span class="counter" id="slideCounter">1 / 1</span>
        <button class="btn" id="btnAutoPlay" onclick="toggleAutoPlay()" title="Pausar/Retomar Leitura Automática">⏸</button>
        <button class="btn" onclick="toggleFullScreen()" title="Tela Cheia">⛶</button>
        <button class="btn" id="btnNext" onclick="nextSlide()" aria-label="Próximo Slide">▶</button>
      </div>
    </footer>
  </div>

  <script>
    const IMAGES = {
      crucifix: 'https://images.unsplash.com/photo-1544642899-f0d6e5f6ed6f?q=80&w=1200&auto=format&fit=crop',
      credo: 'https://images.unsplash.com/photo-1519817650390-64a93db51149?q=80&w=1200&auto=format&fit=crop',
      rosary: 'https://images.unsplash.com/photo-1548625361-19597c8d9e26?q=80&w=1200&auto=format&fit=crop',
      gospel: 'https://images.unsplash.com/photo-1504052434569-70ad5836ab65?q=80&w=1200&auto=format&fit=crop',
      marian: 'https://images.unsplash.com/photo-1562947113-1811a030cb5d?q=80&w=1200&auto=format&fit=crop',
      
      anunciacao: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Fra_Angelico_-_The_Annunciation_-_WGA00473.jpg/1280px-Fra_Angelico_-_The_Annunciation_-_WGA00473.jpg',
      visitacao: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Mariotto_Albertinelli_-_Visitation_-_WGA00132.jpg/1280px-Mariotto_Albertinelli_-_Visitation_-_WGA00132.jpg',
      nascimento: 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/Gerard_van_Honthorst_-_Adoration_of_the_Shepherds_%281622%29.jpg/1280px-Gerard_van_Honthorst_-_Adoration_of_the_Shepherds_%281622%29.jpg',
      apresentacao: 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/Fra_Angelico_-_Presentation_of_Jesus_in_the_Temple_%28Cell_10%29_-_WGA00543.jpg/1280px-Fra_Angelico_-_Presentation_of_Jesus_in_the_Temple_%28Cell_10%29_-_WGA00543.jpg',
      perda: 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/be/Jesus_among_the_doctors_-_Albrecht_D%C3%BCrer.jpg/1280px-Jesus_among_the_doctors_-_Albrecht_D%C3%BCrer.jpg',

      horto: 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Andrea_Mantegna_-_The_Agony_in_the_Garden_-_National_Gallery.jpg/1280px-Andrea_Mantegna_-_The_Agony_in_the_Garden_-_National_Gallery.jpg',
      flagelacao: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/William-Adolphe_Bouguereau_%281825-1905%29_-_The_Flagellation_of_Our_Lord_Jesus_Christ_%281880%29.jpg/1280px-William-Adolphe_Bouguereau_%281825-1905%29_-_The_Flagellation_of_Our_Lord_Jesus_Christ_%281880%29.jpg',
      espinhos: 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/Ecce_homo_by_Caravaggio.jpg/1280px-Ecce_homo_by_Caravaggio.jpg',
      cruz_costas: 'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d7/El_Greco_-_Christ_Carrying_the_Cross_%28Metropolitan_Museum_of_Art%29.jpg/1280px-El_Greco_-_Christ_Carrying_the_Cross_%28Metropolitan_Museum_of_Art%29.jpg',
      calvario: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Crucifixion_by_Vel%C3%A1zquez.jpg/1280px-Crucifixion_by_Vel%C3%A1zquez.jpg',

      ressurreicao: 'https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/Piero_della_Francesca_043.jpg/1280px-Piero_della_Francesca_043.jpg',
      ascensao: 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/Pietro_Perugino_-_Ascension_of_Christ_-_WGA17255.jpg/1280px-Pietro_Perugino_-_Ascension_of_Christ_-_WGA17255.jpg',
      pentecostes: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/cf/El_Greco_-_Pentecost_-_Google_Art_Project.jpg/1280px-El_Greco_-_Pentecost_-_Google_Art_Project.jpg',
      assuncao: 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/Titian_Assunta.jpg/1280px-Titian_Assunta.jpg',
      coroacao: 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/Diego_Vel%C3%A1zquez_-_Coronation_of_the_Virgin_-_Prado.jpg/1280px-Diego_Vel%C3%A1zquez_-_Coronation_of_the_Virgin_-_Prado.jpg',

      batismo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/Leonardo_da_Vinci_-_Baptism_of_Christ_-_Uffizi.jpg/1280px-Leonardo_da_Vinci_-_Baptism_of_Christ_-_Uffizi.jpg',
      cana: 'https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Noces_de_Cana_-_Paolo_Caliari_dito_Veronese_-_Mus%C3%A9e_du_Louvre_INV_142.jpg/1280px-Noces_de_Cana_-_Paolo_Caliari_dito_Veronese_-_Mus%C3%A9e_du_Louvre_INV_142.jpg',
      reino: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/Sermon_on_the_mount_bloch.jpg/1280px-Sermon_on_the_mount_bloch.jpg',
      transfiguracao: 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/59/Transfiguration_Raphael.jpg/1280px-Transfiguration_Raphael.jpg',
      eucaristia: 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/08/Leonardo_da_Vinci_%281452-1519%29_-_The_Last_Supper_%281495-1498%29.jpg/1280px-Leonardo_da_Vinci_%281452-1519%29_-_The_Last_Supper_%281495-1498%29.jpg'
    };

    // Tempos ajustados com redução de 30% (70% do tempo original)
    const PHRASES_PAI_NOSSO = [
      { text: "Pai Nosso que estais nos Céus,", duration: 1750 },
      { text: "santificado seja o vosso Nome,", duration: 1680 },
      { text: "venha a nós o vosso Reino,", duration: 1540 },
      { text: "seja feita a vossa vontade,", duration: 1540 },
      { text: "assim na terra como no Céu.", duration: 1680, spacerAfter: true },
      { text: "O pão nosso de cada dia nos dai hoje,", duration: 1960 },
      { text: "perdoai-nos as nossas ofensas,", duration: 1680 },
      { text: "assim como nós perdoamos a quem nos tem ofendido,", duration: 2240 },
      { text: "e não nos deixeis cair em tentação,", duration: 1750 },
      { text: "mas livrai-nos do Mal.", duration: 1400 },
      { text: "Amém.", duration: 1050 }
    ];

    const PHRASES_AVE_MARIA = [
      { text: "Ave Maria, cheia de graça,", duration: 1680 },
      { text: "o Senhor é convosco,", duration: 1400 },
      { text: "bendita sois vós entre as mulheres,", duration: 1820 },
      { text: "e bendito é o fruto do vosso ventre, Jesus.", duration: 2100, spacerAfter: true },
      { text: "Santa Maria, Mãe de Deus,", duration: 1680 },
      { text: "rogai por nós, pecadores,", duration: 1540 },
      { text: "agora e na hora da nossa morte.", duration: 1960 },
      { text: "Amém.", duration: 1050 }
    ];

    const TEXTO_GLORIA_JACULATORIA = "Glória ao Pai, e ao Filho e ao Espírito Santo. Como era no princípio, agora e sempre. Amém.\n\n—\n\n«Ó meu Jesus, perdoai-nos, livrai-nos do fogo do inferno, levai as almas todas para o Céu e socorrei principalmente as que mais precisarem da vossa misericórdia.»";

    const MISTERIOS = {
      gozosos: {
        nome: "Mistérios Gozosos",
        itens: [
          { tit: "1º Mistério Gozoso", desc: "A Anunciação do Arcanjo Gabriel à Virgem Maria e a Encarnação do Verbo.", img: IMAGES.anunciacao },
          { tit: "2º Mistério Gozoso", desc: "A Visitação de Nossa Senhora a sua prima Santa Isabel.", img: IMAGES.visitacao },
          { tit: "3º Mistério Gozoso", desc: "O Nascimento de Jesus no presépio de Belém.", img: IMAGES.nascimento },
          { tit: "4º Mistério Gozoso", desc: "A Apresentação do Menino Jesus no Templo e a Purificação de Nossa Senhora.", img: IMAGES.apresentacao },
          { tit: "5º Mistério Gozoso", desc: "A Perda e o Encontro do Menino Jesus no Templo entre os Doutores.", img: IMAGES.perda }
        ]
      },
      dolorosos: {
        nome: "Mistérios Dolorosos",
        itens: [
          { tit: "1º Mistério Doloroso", desc: "A Agonia de Jesus no Horto das Oliveiras.", img: IMAGES.horto },
          { tit: "2º Mistério Doloroso", desc: "A Flagelação de Nosso Senhor Jesus Cristo atado à coluna.", img: IMAGES.flagelacao },
          { tit: "3º Mistério Doloroso", desc: "A Coroação de Espinhos de Nosso Senhor.", img: IMAGES.espinhos },
          { tit: "4º Mistério Doloroso", desc: "Jesus carregando a pesada Cruz a caminho do Calvário.", img: IMAGES.cruz_costas },
          { tit: "5º Mistério Doloroso", desc: "A Crucificação e Morte de Jesus Cristo na Cruz.", img: IMAGES.calvario }
        ]
      },
      gloriosos: {
        nome: "Mistérios Gloriosos",
        itens: [
          { tit: "1º Mistério Glorioso", desc: "A Triunfante Ressurreição de Jesus Cristo.", img: IMAGES.ressurreicao },
          { tit: "2º Mistério Glorioso", desc: "A Gloriosa Ascensão de Jesus ao Céu.", img: IMAGES.ascensao },
          { tit: "3º Mistério Glorioso", desc: "A Descida do Espírito Santo sobre os Apóstolos e Maria em Pentecostes.", img: IMAGES.pentecostes },
          { tit: "4º Mistério Glorioso", desc: "A Assunção de Nossa Senhora ao Céu em corpo e alma.", img: IMAGES.assuncao },
          { tit: "5º Mistério Glorioso", desc: "A Coroação de Nossa Senhora como Rainha do Céu e da Terra.", img: IMAGES.coroacao }
        ]
      },
      luminosos: {
        nome: "Mistérios Luminosos",
        itens: [
          { tit: "1º Mistério Luminoso", desc: "O Batismo de Jesus no Rio Jordão.", img: IMAGES.batismo },
          { tit: "2º Mistério Luminoso", desc: "A Auto-revelação de Jesus no Primeiro Milagre nas Bodas de Caná.", img: IMAGES.cana },
          { tit: "3º Mistério Luminoso", desc: "O Anúncio do Reino de Deus e o convite à Conversão.", img: IMAGES.reino },
          { tit: "4º Mistério Luminoso", desc: "A Transfiguração de Jesus no Monte Tabor.", img: IMAGES.transfiguracao },
          { tit: "5º Mistério Luminoso", desc: "A Instituição da Santíssima Eucaristia na Última Ceia.", img: IMAGES.eucaristia }
        ]
      }
    };

    let slidesData = [];
    let currentSlide = 0;
    let autoPlayEnabled = true;
    let guidedTimeouts = [];

    function getMisterioDoDia() {
      const day = new Date().getDay();
      if (day === 1 || day === 6) return MISTERIOS.gozosos;
      if (day === 2 || day === 5) return MISTERIOS.dolorosos;
      if (day === 0 || day === 3) return MISTERIOS.gloriosos;
      if (day === 4) return MISTERIOS.luminosos;
    }

    function getEvangelistaNome(referencia, titulo) {
      const ref = (referencia + ' ' + titulo).toLowerCase();
      if (ref.includes('mt') || ref.includes('mateus')) return 'São Mateus';
      if (ref.includes('mc') || ref.includes('marcos')) return 'São Marcos';
      if (ref.includes('lc') || ref.includes('lucas')) return 'São Lucas';
      if (ref.includes('jo') || ref.includes('joão') || ref.includes('joao')) return 'São João';
      return 'Jesus Cristo';
    }

    async function fetchEvangelhoCompleto() {
      const now = new Date();
      const dia = String(now.getDate()).padStart(2, '0');
      const mes = String(now.getMonth() + 1).padStart(2, '0');

      const urls = [
        `https://liturgia.up.railway.app/${dia}-${mes}`,
        `https://liturgia.up.railway.app/v2/`
      ];

      for (const url of urls) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 2500);
          
          const response = await fetch(url, { signal: controller.signal });
          clearTimeout(timeoutId);

          if (!response.ok) continue;
          const data = await response.json();

          let ev = null;
          let acclamacao = "";

          if (data.leituras && Array.isArray(data.leituras)) {
            ev = data.leituras.find(l => l.tipo && l.tipo.toLowerCase().includes('evangelho'));
            const aclObj = data.leituras.find(l => l.tipo && (l.tipo.toLowerCase().includes('aclamação') || l.tipo.toLowerCase().includes('aclamacao') || l.tipo.toLowerCase().includes('aleluia')));
            if (aclObj) {
              acclamacao = (aclObj.texto || aclObj.conteudo || "").trim();
            }
          } else if (data.evangelho) {
            ev = data.evangelho;
          }

          if (ev && (ev.texto || ev.conteudo)) {
            const referencia = ev.referencia ? `Evangelho (${ev.referencia})` : "Evangelho do Dia";
            const titulo = ev.titulo || "Proclamação do Evangelho";
            const evangelista = getEvangelistaNome(referencia, titulo);
            let corpoTexto = (ev.texto || ev.conteudo || "").trim();

            let textoFinal = `— O Senhor esteja convosco.\n<span class="liturgical-resp">— Ele está no meio de nós.</span>\n\n— Proclamação do Evangelho de Jesus Cristo + segundo ${evangelista}.\n<span class="liturgical-resp">— Glória a vós, Senhor.</span>\n\n${corpoTexto}\n\n— Palavra da Salvação.\n<span class="liturgical-resp">— Glória a vós, Senhor.</span>`;

            return {
              referencia: referencia,
              titulo: titulo,
              acclamacao: acclamacao,
              textoCompletoHtml: textoFinal
            };
          }
        } catch (e) {}
      }

      return {
        referencia: "Evangelho do Dia",
        titulo: "Meditação Diária",
        acclamacao: "«Aleluia, aleluia, aleluia. Permanecei em meu amor!»",
        textoCompletoHtml: `— O Senhor esteja convosco.\n<span class="liturgical-resp">— Ele está no meio de nós.</span>\n\n— Proclamação do Evangelho de Jesus Cristo.\n<span class="liturgical-resp">— Glória a vós, Senhor.</span>\n\n«Permanecei em Mim e Eu permanecerei em vós. Aquele que permanece em Mim e Eu nele, esse dá muito fruto; porque sem Mim nada podeis fazer.»\n\n— Palavra da Salvação.\n<span class="liturgical-resp">— Glória a vós, Senhor.</span>`
      };
    }

    async function initApp() {
      const mist = getMisterioDoDia();

      montarArrayDeSlides(mist, {
        referencia: "Evangelho do Dia",
        titulo: "Carregando leitura...",
        acclamacao: "",
        textoCompletoHtml: "Carregando a Liturgia da Palavra..."
      });

      renderTrackerStructure();
      updateSlideUI();

      const evangelho = await fetchEvangelhoCompleto();
      slidesData[1] = {
        badge: "Liturgia da Palavra",
        titulo: `${evangelho.referencia}`,
        sub: evangelho.titulo,
        acclamacao: evangelho.acclamacao,
        htmlContent: evangelho.textoCompletoHtml,
        img: IMAGES.gospel,
        justify: true
      };

      if (currentSlide === 1) updateSlideUI();
    }

    function montarArrayDeSlides(mist, evangelho) {
      slidesData = [
        {
          badge: "Oração Inicial",
          titulo: "O Santo Terço",
          texto: "Em nome do Pai, do Filho e do Espírito Santo. Amém.\n\nOferecemos este terço em louvor e glória de Jesus e de Maria, pelas intenções da Santa Igreja e pelas nossas famílias.",
          img: IMAGES.crucifix
        },
        {
          badge: "Liturgia da Palavra",
          titulo: `${evangelho.referencia}`,
          sub: evangelho.titulo,
          acclamacao: evangelho.acclamacao,
          htmlContent: evangelho.textoCompletoHtml,
          img: IMAGES.gospel,
          justify: true
        },
        {
          badge: "Profissão de Fé",
          titulo: "Creio em Deus Pai",
          texto: "Creio em Deus Pai Todo-Poderoso, Criador do céu e da terra.\nE em Jesus Cristo, seu único Filho, nosso Senhor, que foi concebido pelo poder do Espírito Santo, nasceu da Virgem Maria, padeceu sob Pôncio Pilatos, foi crucificado, morto e sepultado.\nDesceu à mansão dos mortos, ressuscitou ao terceiro dia, subiu aos céus, está sentado à direita de Deus Pai Todo-Poderoso, donde há de vir a julgar os vivos e os mortos.\n\nCreio no Espírito Santo, na Santa Igreja Católica, na comunhão dos Santos, na remissão dos pecados, na ressurreição da carne e na vida eterna. Amém.",
          img: IMAGES.credo,
          justify: true
        },
        {
          badge: "Meditação do Dia",
          titulo: `${mist.nome}`,
          texto: "Hoje contemplamos com amor e veneração os santos mistérios da nossa salvação.",
          img: IMAGES.rosary
        }
      ];

      mist.itens.forEach((m, idxDezena) => {
        const numDezena = idxDezena + 1;

        slidesData.push({
          badge: `Dezena ${numDezena} de 5`,
          titulo: m.tit,
          texto: `${m.desc}\n\nOferecemos esta dezena ao Coração Imaculado de Maria.`,
          img: m.img
        });

        slidesData.push({
          badge: `Dezena ${numDezena} • Pai-Nosso`,
          titulo: "Pai-Nosso",
          sub: m.tit,
          guidedPhrases: PHRASES_PAI_NOSSO,
          img: m.img,
          tracker: { dezena: numDezena, beadIndex: 0 }
        });

        for (let i = 1; i <= 10; i++) {
          slidesData.push({
            badge: `Dezena ${numDezena} • Ave-Maria (${i}/10)`,
            titulo: `${i}ª Ave-Maria`,
            sub: m.tit,
            guidedPhrases: PHRASES_AVE_MARIA,
            img: m.img,
            tracker: { dezena: numDezena, beadIndex: i }
          });
        }

        slidesData.push({
          badge: `Dezena ${numDezena} • Conclusão`,
          titulo: "Glória ao Pai",
          sub: m.tit,
          texto: TEXTO_GLORIA_JACULATORIA,
          img: m.img
        });
      });

      slidesData.push(
        {
          badge: "Oração Final",
          titulo: "Salve Rainha",
          texto: "Salve, Rainha, Mãe de misericórdia, vida, doçura e esperança nossa, salve!\nA vós bradamos os degredados filhos de Eva.\nA vós suspiramos, gemendo e chorando neste vale de lágrimas.\n\nEia, pois, advogada nossa, esses vossos olhos misericordiosos a nós volvei, e depois deste desterro mostrai-nos Jesus, bendito fruto do vosso ventre, ó clemente, ó piedosa, ó doce sempre Virgem Maria.\n\nRogai por nós, Santa Mãe de Deus, para que sejamos dignos das promessas de Cristo. Amém.",
          img: IMAGES.marian,
          justify: true
        },
        {
          badge: "Encerramento",
          titulo: "Graças e Louvores",
          texto: "Louvado seja nosso Senhor Jesus Cristo!\nPara sempre seja louvado, e sua Mãe Maria Santíssima.\n\nEm nome do Pai, do Filho e do Espírito Santo. Amém.",
          img: IMAGES.crucifix
        }
      );
    }

    function renderTrackerStructure() {
      const tracker = document.getElementById('rosaryTracker');
      tracker.innerHTML = `
        <div class="bead pn" id="bead-0" title="Pai-Nosso"></div>
        <div class="bead-separator"></div>
        ${Array.from({length: 10}, (_, i) => `<div class="bead" id="bead-${i+1}" title="${i+1}ª Ave-Maria"></div>`).join('')}
      `;
    }

    function clearGuidedTimers() {
      guidedTimeouts.forEach(t => clearTimeout(t));
      guidedTimeouts = [];
    }

    function updateSlideUI() {
      clearGuidedTimers();

      const s = slidesData[currentSlide];
      if (!s) return;

      document.getElementById('bgLayer').style.backgroundImage = `url('${s.img}')`;
      document.getElementById('cardBadge').innerText = s.badge || "Oração";
      document.getElementById('cardTitle').innerText = s.titulo || "";

      const subEl = document.getElementById('cardSubtitle');
      if (s.sub) {
        subEl.innerText = s.sub;
        subEl.style.display = 'block';
      } else {
        subEl.style.display = 'none';
      }

      const aclEl = document.getElementById('cardAcclamacao');
      if (s.acclamacao) {
        aclEl.innerText = s.acclamacao;
        aclEl.style.display = 'block';
      } else {
        aclEl.style.display = 'none';
      }

      const bodyEl = document.getElementById('cardBody');
      const cardContainer = document.getElementById('cardContainer');
      cardContainer.scrollTop = 0;

      if (s.guidedPhrases) {
        bodyEl.classList.remove('align-justify');
        let htmlPhrases = '';
        s.guidedPhrases.forEach((p, index) => {
          htmlPhrases += `<span class="phrase-line" id="phrase-${index}">${p.text}</span>`;
          if (p.spacerAfter) htmlPhrases += `<div class="phrase-spacer"></div>`;
        });
        bodyEl.innerHTML = htmlPhrases;

        if (autoPlayEnabled) {
          startGuidedReading(s.guidedPhrases);
        } else {
          s.guidedPhrases.forEach((_, i) => {
            const el = document.getElementById(`phrase-${i}`);
            if (el) el.classList.add('read');
          });
        }
      } else {
        if (s.htmlContent) {
          bodyEl.innerHTML = s.htmlContent;
        } else {
          bodyEl.innerText = s.texto || "";
        }

        if (s.justify) bodyEl.classList.add('align-justify');
        else bodyEl.classList.remove('align-justify');
      }

      document.getElementById('slideCounter').innerText = `${currentSlide + 1} / ${slidesData.length}`;

      const btnPrev = document.getElementById('btnPrev');
      if (btnPrev) {
        btnPrev.disabled = (currentSlide === 0);
      }

      const btnNext = document.getElementById('btnNext');
      if (btnNext) {
        btnNext.disabled = (currentSlide === slidesData.length - 1);
      }

      const trackerEl = document.getElementById('rosaryTracker');
      if (s.tracker !== undefined) {
        trackerEl.style.display = 'flex';
        const currentIndex = s.tracker.beadIndex;

        for (let i = 0; i <= 10; i++) {
          const bead = document.getElementById(`bead-${i}`);
          if (!bead) continue;

          bead.classList.remove('current', 'completed');
          if (i === currentIndex) {
            bead.classList.add('current');
          } else if (i < currentIndex) {
            bead.classList.add('completed');
          }
        }
      } else {
        trackerEl.style.display = 'none';
      }
    }

    function startGuidedReading(phrases) {
      let accumulatedTime = 200;

      phrases.forEach((phrase, index) => {
        const timeout = setTimeout(() => {
          if (index > 0) {
            const prevEl = document.getElementById(`phrase-${index - 1}`);
            if (prevEl) {
              prevEl.classList.remove('active');
              prevEl.classList.add('read');
            }
          }
          const currentEl = document.getElementById(`phrase-${index}`);
          if (currentEl) {
            currentEl.classList.add('active');
            currentEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        }, accumulatedTime);

        guidedTimeouts.push(timeout);
        accumulatedTime += phrase.duration;
      });

      const finalTimeout = setTimeout(() => {
        const lastEl = document.getElementById(`phrase-${phrases.length - 1}`);
        if (lastEl) {
          lastEl.classList.remove('active');
          lastEl.classList.add('read');
        }
        nextSlide();
      }, accumulatedTime + 900);

      guidedTimeouts.push(finalTimeout);
    }

    function toggleAutoPlay() {
      autoPlayEnabled = !autoPlayEnabled;
      document.getElementById('btnAutoPlay').innerText = autoPlayEnabled ? '⏸' : '▶';
      updateSlideUI();
    }

    function showSlide(index) {
      if (index < 0) {
        currentSlide = 0;
      } else if (index >= slidesData.length) {
        currentSlide = slidesData.length - 1;
      } else {
        currentSlide = index;
      }

      updateSlideUI();
    }

    function nextSlide() {
      if (currentSlide < slidesData.length - 1) {
        showSlide(currentSlide + 1);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        showSlide(currentSlide - 1);
      }
    }

    function toggleFullScreen() {
      try {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen();
          } else if (document.documentElement.webkitRequestFullscreen) {
            document.documentElement.webkitRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        }
      } catch (e) {}
    }

    // Gestos Touch (Swipe)
    let touchStartX = 0;
    let touchEndX = 0;

    const touchZone = document.getElementById('touchZone');
    touchZone.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    touchZone.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      if (touchEndX < touchStartX - 50) nextSlide();
      if (touchEndX > touchStartX + 50) prevSlide();
    }, { passive: true });

    // Teclado
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
      if (e.key.toLowerCase() === 'p') toggleAutoPlay();
    });

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
